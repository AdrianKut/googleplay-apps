<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>96Games</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <meta name="description"
          content="Official website for mobile applications developed by Aixen.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 18px;
        }

        .app {
            background: #fff;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .app h2 {
            margin-top: 0;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            color: #1769e0;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        footer a {
            color: #1769e0;
        }
    </style>
</head>

<body>

<div class="container">
<center><img src="logo.png" width="25%"></img></center> 
    <header>      
        <p>
            Mobile applications available on Google Play.
        </p>    
    </header>

    <main>

        <section class="app">
            <h2>Pong</h2>

            <div class="links">
                <a href="https://play.google.com/store/apps/details?id=com.AdrianKut.PogPong"
                   target="_blank"
                   rel="noopener noreferrer">
                    Google Play
                </a>

                <a href="./PongPolicy/">
                    Privacy Policy
                </a>
            </div>
        </section>


        <section class="app">
            <h2>Labyrinth HD</h2>

            <div class="links">
                <a href="https://play.google.com/store/apps/details?id=com.AdrianKut.Labyrinth"
                   target="_blank"
                   rel="noopener noreferrer">
                    Google Play
                </a>

                <a href="./LabyrinthPolicy/">
                    Privacy Policy
                </a>
            </div>
        </section>

    </main>


    <footer>

        <p>
            Contact:
            <a href="mailto:aixen96@gmail.com">
                aixen96@gmail.com
            </a>
        </p>

        <p>
            © 2026 Aixen. All rights reserved.
        </p>

    </footer>

</div>

</html>
